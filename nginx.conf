pid /tmp/nginx.pid;

events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;

  server {
    listen       8080;
    server_name  arnovannieuwenhuyzen.com www.arnovannieuwenhuyzen.com;
    root         /usr/share/nginx/html;
    index        index.html;
    absolute_redirect off;

    # Unknown paths get a real 404 status. the SPA fallback renders the 404 page.
    error_page 404 /__spa-fallback.html;

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Prerendered pages (/blog) and their .data files
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/index.html =404;
    }
  }
}
